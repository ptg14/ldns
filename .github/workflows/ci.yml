name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, 'feat/**']
  workflow_dispatch:

# Cancel superseded PR runs, but let every push to main produce a complete CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-asan]
    steps:
      - uses: actions/checkout@v4

      # Use runner pre-installed vcpkg if available, otherwise clone shallow
      - name: Set up vcpkg
        run: |
          if [ -d "$VCPKG_INSTALLATION_ROOT" ] && [ -x "$VCPKG_INSTALLATION_ROOT/vcpkg" ]; then
            echo "Using pre-installed vcpkg at $VCPKG_INSTALLATION_ROOT"
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
            echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          fi

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build autoconf autoconf-archive automake libtool

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (CLI & TUI)
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (Unit & Integration Tests)
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Verify CLI & TUI Binaries
        run: |
          BIN_DIR="build/${{ matrix.preset }}"
          echo "Verifying TUI binary ($BIN_DIR/ldns)..."
          "$BIN_DIR/ldns" --version
          echo "Verifying CLI binary ($BIN_DIR/ldns-cli)..."
          "$BIN_DIR/ldns-cli" --version
          "$BIN_DIR/ldns-cli" --help | head -n 15

  windows:
    name: Windows (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        shell: pwsh
        run: |
          if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe")) {
            Write-Host "Using pre-installed vcpkg at $env:VCPKG_INSTALLATION_ROOT"
            "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
            & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
            "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      - name: Set up Ninja
        shell: pwsh
        run: |
          $ninja = Get-ChildItem "$env:ProgramFiles\Microsoft Visual Studio" -Filter ninja.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ninja) {
            Split-Path $ninja.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            choco install ninja -y --no-progress
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:Path += ";C:\ProgramData\chocolatey\bin"
          }
          ninja --version

      - name: Report toolchain
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (CLI & TUI)
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (Unit & Integration Tests)
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Verify CLI & TUI Binaries
        shell: pwsh
        run: |
          $binDir = "build/${{ matrix.preset }}"
          Write-Host "Verifying TUI binary ($binDir/ldns.exe)..."
          & "$binDir/ldns.exe" --version
          Write-Host "Verifying CLI binary ($binDir/ldns-cli.exe)..."
          & "$binDir/ldns-cli.exe" --version
          & "$binDir/ldns-cli.exe" --help | Select-Object -First 15
